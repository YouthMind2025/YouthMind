name: iOS CI

on:
  push:
    branches: [ main, frontend ]
    paths:
      - 'Saysomething/**'
      - '.github/workflows/ci-ios.yml'
  pull_request:
    branches: [ main, frontend ]
    paths:
      - 'Saysomething/**'

jobs:
  test:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.0'
        
    - name: Cache CocoaPods
      uses: actions/cache@v3
      with:
        path: ~/Library/Caches/CocoaPods
        key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-pods-
          
    - name: Install dependencies
      run: |
        cd Saysomething
        pod install
        
    - name: Build and test
      run: |
        cd Saysomething
        xcodebuild test -workspace Saysomething.xcworkspace -scheme Saysomething -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' | xcpretty
        
    - name: Build for release
      run: |
        cd Saysomething
        xcodebuild archive -workspace Saysomething.xcworkspace -scheme Saysomething -configuration Release -archivePath build/Saysomething.xcarchive
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: ios-build
        path: Saysomething/build/ 