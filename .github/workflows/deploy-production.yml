name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
        
    - name: Build backend
      run: |
        cd backend
        mvn clean package -DskipTests
        
    - name: Build Docker image
      run: |
        docker build -t youthmind-backend:${{ github.sha }} ./backend
        docker tag youthmind-backend:${{ github.sha }} youthmind-backend:production
        
    - name: Login to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.CONTAINER_REGISTRY }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
        
    - name: Push Docker image
      run: |
        docker tag youthmind-backend:production ${{ secrets.CONTAINER_REGISTRY }}/youthmind-backend:production
        docker push ${{ secrets.CONTAINER_REGISTRY }}/youthmind-backend:production
        
    - name: Deploy to Kubernetes
      run: |
        kubectl set image deployment/youthmind-backend youthmind-backend=${{ secrets.CONTAINER_REGISTRY }}/youthmind-backend:production -n production
        
    - name: Wait for deployment
      run: |
        kubectl rollout status deployment/youthmind-backend -n production --timeout=300s
        
    - name: Run smoke tests
      run: |
        # Add your smoke test commands here
        curl -f ${{ secrets.PRODUCTION_API_URL }}/health || exit 1
        
  deploy-ai-service:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        cd ai-service
        pip install -r requirements.txt
        
    - name: Run tests
      run: |
        cd ai-service
        pytest
        
    - name: Build Docker image
      run: |
        docker build -t youthmind-ai:${{ github.sha }} ./ai-service
        docker tag youthmind-ai:${{ github.sha }} youthmind-ai:production
        
    - name: Login to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.CONTAINER_REGISTRY }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
        
    - name: Push Docker image
      run: |
        docker tag youthmind-ai:production ${{ secrets.CONTAINER_REGISTRY }}/youthmind-ai:production
        docker push ${{ secrets.CONTAINER_REGISTRY }}/youthmind-ai:production
        
    - name: Deploy to Kubernetes
      run: |
        kubectl set image deployment/youthmind-ai youthmind-ai=${{ secrets.CONTAINER_REGISTRY }}/youthmind-ai:production -n production
        
    - name: Wait for deployment
      run: |
        kubectl rollout status deployment/youthmind-ai -n production --timeout=300s
        
  notify-deployment:
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-ai-service]
    
    steps:
    - name: Notify Slack
      uses: 8398a7/action-slack@v3
      with:
        status: success
        channel: '#deployments'
        text: 'Production deployment completed successfully! 🚀'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }} 