name: Deploy to Staging

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
        
    - name: Build backend
      run: |
        cd backend
        mvn clean package -DskipTests
        
    - name: Build Docker image
      run: |
        docker build -t youthmind-backend:${{ github.sha }} ./backend
        docker tag youthmind-backend:${{ github.sha }} youthmind-backend:staging
        
    - name: Login to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.CONTAINER_REGISTRY }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
        
    - name: Push Docker image
      run: |
        docker tag youthmind-backend:staging ${{ secrets.CONTAINER_REGISTRY }}/youthmind-backend:staging
        docker push ${{ secrets.CONTAINER_REGISTRY }}/youthmind-backend:staging
        
    - name: Deploy to Kubernetes
      run: |
        kubectl set image deployment/youthmind-backend youthmind-backend=${{ secrets.CONTAINER_REGISTRY }}/youthmind-backend:staging -n staging
        
  deploy-ai-service:
    runs-on: ubuntu-latest
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        cd ai-service
        pip install -r requirements.txt
        
    - name: Run tests
      run: |
        cd ai-service
        pytest
        
    - name: Build Docker image
      run: |
        docker build -t youthmind-ai:${{ github.sha }} ./ai-service
        docker tag youthmind-ai:${{ github.sha }} youthmind-ai:staging
        
    - name: Login to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.CONTAINER_REGISTRY }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
        
    - name: Push Docker image
      run: |
        docker tag youthmind-ai:staging ${{ secrets.CONTAINER_REGISTRY }}/youthmind-ai:staging
        docker push ${{ secrets.CONTAINER_REGISTRY }}/youthmind-ai:staging
        
    - name: Deploy to Kubernetes
      run: |
        kubectl set image deployment/youthmind-ai youthmind-ai=${{ secrets.CONTAINER_REGISTRY }}/youthmind-ai:staging -n staging 