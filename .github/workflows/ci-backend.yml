name: Backend CI

on:
  push:
    branches: [ main, backend ]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [ main, backend ]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
        
    - name: Cache Maven packages
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Run tests
      run: |
        cd backend
        mvn clean test
        
    - name: Build JAR
      run: |
        cd backend
        mvn clean package -DskipTests
        
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results
        path: backend/target/surefire-reports/
        
  security-scan:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python and security tools
      run: |
        sudo apt-get update
        sudo apt-get install -y jq python3-pip
        pip3 install sqlmap

    - name: Build application
      run: |
        cd backend
        mvn clean package -DskipTests

    - name: Start application
      run: |
        cd backend
        # Start the application in the background
        java -jar target/*.jar --spring.profiles.active=dev &
        echo $! > app.pid

        # Wait for application to start
        for i in {1..30}; do
          if curl -s https://localhost:8080/actuator/health > /dev/null 2>&1; then
            echo "Application started successfully"
            break
          fi
          echo "Waiting for application to start... ($i/30)"
          sleep 5
        done

    - name: Run security scan
      run: |
        cd backend
        # Make sure the security scan script is executable
        chmod +x security-scan.sh
        # Run the security scan
        APPLICATION_URL="https://localhost:8080" ./security-scan.sh

    - name: Stop application
      run: |
        if [ -f backend/app.pid ]; then
          kill $(cat backend/app.pid) || true
        fi

    - name: Upload security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: backend/scan/security-reports/

    - name: Check for critical vulnerabilities
      run: |
        if [ -f backend/scan/security-reports/summary.txt ] && grep -q "CRITICAL" backend/scan/security-reports/summary.txt; then
          echo "Critical vulnerabilities found! Failing security scan."
          exit 1
        fi

