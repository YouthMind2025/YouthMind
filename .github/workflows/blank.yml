name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  backend-check:
    name: Backend Build & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Spring Boot backend
        run: ./mvnw clean package

  ai-service-check:
    name: AI Microservice Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          cd ai/
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          cd ai/
          pytest

  ios-check:
    name: iOS Placeholder (manual trigger)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest

    steps:
      - name: Info
        run: echo "Add xcodebuild steps later for iOS CI"
