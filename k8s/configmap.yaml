apiVersion: v1
kind: ConfigMap
metadata:
  name: youthmind-config
  namespace: youthmind
data:
  # Recommendation Engine Configuration
  YOUTHMIND_RECOMMENDATION_ENABLED: "true"
  YOUTHMIND_DEFAULT_BLOCK_SIZE: "20"
  YOUTHMIND_BLOCK_EXPIRY_HOURS: "1"
  YOUTHMIND_RVECTOR_CACHE_TTL_MINUTES: "30"
  YOUTHMIND_EVENT_QUEUE_MAX_DEPTH: "10000"
  YOUTHMIND_BLOCK_PRECALC_ENABLED: "true"
  YOUTHMIND_FALLBACK_TO_CHRONOLOGICAL: "true"
  YOUTHMIND_MIN_POSTS_PER_EMOTION: "3"
  
  # Redis Streams Configuration
  YOUTHMIND_RVECTOR_UPDATES_STREAM: "recommendation:rvector-updates"
  YOUTHMIND_BLOCK_PRECALC_STREAM: "recommendation:block-precalc"
  YOUTHMIND_CONSUMER_GROUP: "recommendation-engine-workers"
  YOUTHMIND_STREAM_MAX_RETRIES: "3"
  YOUTHMIND_STREAM_RETRY_DELAY_MS: "1000"
  
  # Rate Limiting Configuration
  YOUTHMIND_RATE_LIMIT_MAX_PER_MINUTE: "100"
  YOUTHMIND_RATE_LIMIT_BURST_CAPACITY: "10"
  
  # Circuit Breaker Configuration
  YOUTHMIND_CB_FAILURE_RATE_THRESHOLD: "50"
  YOUTHMIND_CB_WAIT_DURATION_SECONDS: "30"
  YOUTHMIND_CB_SLIDING_WINDOW_SIZE: "10"
  YOUTHMIND_CB_MINIMUM_CALLS: "5"
  
  # Performance Targets
  YOUTHMIND_PERF_RVECTOR_UPDATE_MS: "5"
  YOUTHMIND_PERF_TOP_EMOTION_SELECT_MS: "1"
  YOUTHMIND_PERF_SINGLE_EMOTION_SELECT_MS: "50"
  YOUTHMIND_PERF_FULL_BLOCK_GENERATE_MS: "200"
  YOUTHMIND_PERF_EVENT_PUBLISH_MS: "10"
  
  # Cache Configuration
  YOUTHMIND_CACHE_MAPPING_RULES_TTL_HOURS: "1"
  YOUTHMIND_CACHE_RVECTOR_TTL_MINUTES: "30"
  YOUTHMIND_CACHE_FEED_BLOCKS_TTL_HOURS: "1"
  YOUTHMIND_CACHE_SHOWN_POSTS_TTL_DAYS: "7"
  YOUTHMIND_CACHE_SHOWN_POSTS_MAX_SIZE: "500"
