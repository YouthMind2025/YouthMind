apiVersion: apps/v1
kind: Deployment
metadata:
  name: youthmind-frontend
  namespace: youthmind
  labels:
    app: youthmind-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: youthmind-frontend
  template:
    metadata:
      labels:
        app: youthmind-frontend
    spec:
      containers:
      - name: youthmind-frontend
        image: youthmind-frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: youthmind-frontend
  namespace: youthmind
  labels:
    app: youthmind-frontend
spec:
  selector:
    app: youthmind-frontend
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: youthmind-frontend-hpa
  namespace: youthmind
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: youthmind-frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
