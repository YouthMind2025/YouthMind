version: '3.8'

services:
  # PostgreSQL Database with enhanced logging
  postgres:
    image: postgres:14
    container_name: youthmind-postgres
    environment:
      POSTGRES_DB: youthmind_db
      POSTGRES_USER: youthmind_user
      POSTGRES_PASSWORD: password
      # Enhanced logging configuration
      POSTGRES_INITDB_ARGS: "--logging-collector=on --log-statement=all --log-directory=/var/log/postgresql --log-filename=postgresql.log --log-min-duration-statement=100"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./monitoring/postgres/logs:/var/log/postgresql
      - ./monitoring/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: |
      postgres
      -c log_statement=all
      -c log_min_duration_statement=100
      -c log_line_prefix='%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
      -c log_checkpoints=on
      -c log_connections=on
      -c log_disconnections=on
      -c log_lock_waits=on
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c pg_stat_statements.max=10000
    networks:
      - monitoring

  # Redis Cache with enhanced configuration for recommendation engine
  redis:
    image: redis:7-alpine
    container_name: youthmind-redis
    ports:
      - "6379:6379"
    environment:
      # Redis configuration for recommendation engine
      REDIS_MAXMEMORY: "512mb"
      REDIS_MAXMEMORY_POLICY: "allkeys-lru"
    volumes:
      - redis_data:/data
      - ./monitoring/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - monitoring

  # PostgreSQL Exporter for Prometheus
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: youthmind-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://youthmind_user:password@postgres:5432/youthmind_db?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: "/etc/postgres_exporter/queries.yaml"
    ports:
      - "9187:9187"
    volumes:
      - ./monitoring/postgres-exporter/queries.yaml:/etc/postgres_exporter/queries.yaml
    depends_on:
      - postgres
    networks:
      - monitoring

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: youthmind-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/rules:/etc/prometheus/rules
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    depends_on:
      - postgres-exporter
    networks:
      - monitoring

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: youthmind-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - monitoring

  # Redis Exporter for Prometheus
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: youthmind-redis-exporter
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on:
      - redis
    networks:
      - monitoring

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    driver: bridge 