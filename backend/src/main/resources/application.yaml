server:
  port: 8080

spring:
  application:
    name: youthmind-backend
  profiles:
    active: dev  # Use dev profile by default
  
  datasource:
    url: jdbc:postgresql://localhost:5432/youthmind_db
    username: ${DB_USERNAME:youthmind_user}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate  # Use validate with Flyway migrations
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  # Flyway Configuration (Task 3: Database Migration)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  
  # Multipart file upload configuration
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2KB
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days in milliseconds

# Admin Configuration
admin:
  secret-key: ${ADMIN_SECRET_KEY:YOUTHMIND_ADMIN_2024}

# File Upload Configuration
app:
  upload:
    dir: ${UPLOAD_DIR:uploads}
  avatar:
    max-size: ${AVATAR_MAX_SIZE:2097152} # 2MB
    allowed-types: ${AVATAR_ALLOWED_TYPES:image/jpeg,image/png,image/gif,image/webp}

# OpenAPI/Swagger Configuration
# Application Information for Actuator Info Endpoint
info:
  app:
    name: YouthMind Backend API
    description: Backend API for YouthMind - A mental health support platform for youth
    version: 1.0.0
    encoding: UTF-8
    java:
      source: 17
      target: 17
  build:
    artifact: youthmind-backend
    group: ai.youthmind
    name: YouthMind Backend
    time: ${maven.build.timestamp:unknown}
    version: ${project.version:0.0.1-SNAPSHOT}
  team:
    name: YouthMind Development Team
    email: team@youthmind.ai
    lead-developer: Ahmed
    backend-architect: Mustafo
    devops-engineer: Kevin
  features:
    authentication: JWT-based authentication
    caching: Redis caching with pub/sub
    database: PostgreSQL with Flyway migrations
    ai-integration: AI analysis for posts
    monitoring: Spring Actuator with Prometheus metrics
  dependencies:
    spring-boot: 3.2.5
    postgresql: Latest
    redis: Latest
    jwt: 0.12.3

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  info:
    title: YouthMind Backend API
    description: Backend API for YouthMind - A mental health support platform for youth
    version: 1.0.0
    contact:
      name: YouthMind Team
      email: team@youthmind.ai
    license:
      name: MIT License
      url: https://opensource.org/licenses/MIT
  servers:
    - url: http://localhost:8080
      description: Development server
    - url: https://api.youthmind.ai
      description: Production server

# Actuator Configuration for Monitoring and DevOps
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,beans,configprops,mappings,conditions
      base-path: /actuator
    jmx:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
      group:
        liveness:
          include: ping
        readiness:
          include: redis,database,diskSpace
        custom:
          include: redis,database
          show-details: always
    info:
      enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
    env:
      show-values: when-authorized
    beans:
      enabled: true
    configprops:
      show-values: when-authorized
    mappings:
      enabled: true
    conditions:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
        descriptions: true
        step: 30s
    tags:
      application: youthmind-backend
      environment: ${spring.profiles.active:dev}
      version: ${project.version:0.0.1-SNAPSHOT}
    web:
      server:
        request:
          autotime:
            enabled: true
            percentiles: 0.5, 0.75, 0.95, 0.99
    system:
      cpu:
        enabled: true
      memory:
        enabled: true
      disk:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true
    diskspace:
      enabled: true
      threshold: 100MB
    ping:
      enabled: true
    defaults:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
    build:
      enabled: true
    git:
      enabled: true
      mode: full

# DeepSeek API Configuration
deepseek:
  api:
    base-url: ${YOUTHMIND_DEEPSEEK_API_URL:https://api.deepseek.com/v1}
    api-key: ${YOUTHMIND_DEEPSEEK_API_KEY:}
    timeout: ${YOUTHMIND_DEEPSEEK_TIMEOUT:30000} # 30 seconds
    max-retries: ${YOUTHMIND_DEEPSEEK_MAX_RETRIES:3}
    model: ${YOUTHMIND_DEEPSEEK_MODEL:deepseek-chat}
    
    # Rate limiting configuration
    rate-limit-per-minute: ${YOUTHMIND_DEEPSEEK_RATE_LIMIT:60}
    rate-limit-burst: ${YOUTHMIND_DEEPSEEK_RATE_BURST:10}
    
    # Cost optimization settings
    cache-hit-discount: ${YOUTHMIND_DEEPSEEK_CACHE_DISCOUNT:0.5} # 50% discount for cache hits
    enable-cache-hit-pricing: ${YOUTHMIND_DEEPSEEK_CACHE_PRICING:true}
    
    # Off-peak window configuration
    enable-off-peak-routing: ${YOUTHMIND_DEEPSEEK_OFF_PEAK:true}
    off-peak-start-time: ${YOUTHMIND_DEEPSEEK_OFF_PEAK_START:22:00} # 10 PM
    off-peak-end-time: ${YOUTHMIND_DEEPSEEK_OFF_PEAK_END:06:00} # 6 AM
    off-peak-timezone: ${YOUTHMIND_DEEPSEEK_TIMEZONE:UTC}
    
    # Model selection configuration
    default-model: ${YOUTHMIND_DEEPSEEK_DEFAULT_MODEL:deepseek-chat}
    fallback-model: ${YOUTHMIND_DEEPSEEK_FALLBACK_MODEL:deepseek-chat}
    
    # Authentication configuration
    enable-api-key-rotation: ${YOUTHMIND_DEEPSEEK_KEY_ROTATION:false}
    api-key-rotation-interval-hours: ${YOUTHMIND_DEEPSEEK_KEY_ROTATION_HOURS:24}
    
    # Monitoring and logging
    enable-detailed-logging: ${YOUTHMIND_DEEPSEEK_DETAILED_LOGGING:true}
    enable-cost-tracking: ${YOUTHMIND_DEEPSEEK_COST_TRACKING:true}
    enable-performance-metrics: ${YOUTHMIND_DEEPSEEK_PERFORMANCE_METRICS:true}
    
    # Circuit breaker configuration
    circuit-breaker-failure-threshold: ${YOUTHMIND_DEEPSEEK_CB_THRESHOLD:5}
    circuit-breaker-recovery-timeout: ${YOUTHMIND_DEEPSEEK_CB_TIMEOUT:30} # seconds
    circuit-breaker-half-open-max-calls: ${YOUTHMIND_DEEPSEEK_CB_MAX_CALLS:3}
    
    moderation:
      enabled: ${YOUTHMIND_DEEPSEEK_MODERATION_ENABLED:true}
      threshold: ${YOUTHMIND_DEEPSEEK_MODERATION_THRESHOLD:0.7}

# AI Service Configuration
ai:
  deepseek:
    base-url: ${YOUTHMIND_DEEPSEEK_API_URL:https://api.deepseek.com/v1}
    api-key: ${YOUTHMIND_DEEPSEEK_API_KEY:}
    enabled: ${YOUTHMIND_AI_ENABLED:true}

# Logging
logging:
  level:
    org.springframework.security: DEBUG
    ai.youthmind: DEBUG
    ai.youthmind.service.AIServiceClient: DEBUG 