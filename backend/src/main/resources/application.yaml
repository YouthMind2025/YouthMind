server:
  port: 8080

spring:
  application:
    name: youthmind-backend
  profiles:
    active: dev  # Use dev profile by default
  
  datasource:
    url: jdbc:postgresql://localhost:5432/youthmind_db
    username: ${DB_USERNAME:youthmind_user}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:mySecretKey123456789012345678901234567890}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days in milliseconds

# OpenAPI/Swagger Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  info:
    title: YouthMind Backend API
    description: Backend API for YouthMind - A mental health support platform for youth
    version: 1.0.0
    contact:
      name: YouthMind Team
      email: team@youthmind.ai
    license:
      name: MIT License
      url: https://opensource.org/licenses/MIT
  servers:
    - url: http://localhost:8080
      description: Development server
    - url: https://api.youthmind.ai
      description: Production server

# Logging
logging:
  level:
    org.springframework.security: DEBUG
    ai.youthmind: DEBUG 