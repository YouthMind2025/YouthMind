server:
  port: 8080

spring:
  application:
    name: youthmind-backend
  profiles:
    active: dev  # Use H2 configuration for development (tests will override this)
  
  datasource:
    url: jdbc:postgresql://localhost:5432/youthmind_db
    username: ${DB_USERNAME:youthmind_user}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    
    # HikariCP Connection Pool Configuration for PostgreSQL
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  
  jpa:
    hibernate:
      ddl-auto: validate  # Use validate since Flyway handles schema creation
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  # Flyway Configuration (Database Migration)
  flyway:
    enabled: true  # Enable Flyway by default for proper schema management
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  
  # Multipart file upload configuration
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2KB
  
  data:
    redis:
      enabled: false  # Disable Redis for API testing
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # Email configuration for OTP sending
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME:liyin20200613@gmail.com}
    password: ${EMAIL_PASSWORD:eesy sqna oyvh aoeu}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days in milliseconds

rate:
  limit:
    anonymous:
      default: 100
      sensitive: 10
    authenticated:
      default: 10
      sensitive: 5

# Admin Configuration
admin:
  secret-key: ${ADMIN_SECRET_KEY:YOUTHMIND_ADMIN_2024}

# OTP Configuration
otp:
  expiration-minutes: ${OTP_EXPIRATION_MINUTES:10}
  length: ${OTP_LENGTH:6}
  max-attempts: ${OTP_MAX_ATTEMPTS:3}
  
# Email Configuration
email:
  from: ${EMAIL_FROM:noreply@youthmind.ai}
  from-name: ${EMAIL_FROM_NAME:YouthMind}
  templates:
    otp-subject: "Your YouthMind Verification Code"

# File Upload Configuration
app:
  upload:
    dir: ${UPLOAD_DIR:uploads}

# Embedding Model Configuration
embedding:
  versioning:
    enabled: true
    default-version: "v1"
    auto-migration: false
    max-versions: 5
    version-header: "X-Model-Version"
    version-param: "modelVersion"
  models:
    v1:
      path: "classpath:models/bge-small-v1/model.onnx"
      vocab-file: "classpath:models/bge-small-v1/vocab.txt"
      tokenizer-config: "classpath:model/bge-small-v1/tokenizer_config.json"
      name: "BGE-Small-v1"
      enabled: true
      max-length: 512
      normalize: true
  validation:
    enabled: true
    pre-inference-validation: true
    post-inference-validation: true
    quality-thresholds:
      min-cosine-similarity: 0.7
      max-zero-ratio: 0.3
      min-norm: 0.8
      max-norm: 1.2
      max-nan-ratio: 0.0
      max-duplicate-ratio: 0.1
    test-cases:
      similarity-pairs:
        - "cat|kitten"
        - "car|vehicle"
        - "happy|joyful"
        - "big|large"
        - "small|tiny"
      dissimilarity-pairs:
        - "cat|computer"
        - "happy|sad"
        - "hot|cold"
        - "day|night"
        - "fast|slow"
      duplicate-texts:
        - "The quick brown fox jumps over the lazy dog"
        - "The quick brown fox jumps over the lazy dog"
        - "Pancakes made by granny are so delicious"

# Qdrant Vector Database Configuration
qdrant:
  host: ${QDRANT_HOST:localhost}
  port: ${QDRANT_PORT:6333}
  api-key: ${QDRANT_API_KEY:}
  use-https: ${QDRANT_USE_HTTPS:false}
  timeout-ms: ${QDRANT_TIMEOUT_MS:10000}
  connection-timeout-ms: ${QDRANT_CONNECTION_TIMEOUT_MS:5000}
  
  # Collection Configuration
  default-collection: ${QDRANT_DEFAULT_COLLECTION:youthmind_vectors}
  vector-size: ${QDRANT_VECTOR_SIZE:384}
  distance-metric: ${QDRANT_DISTANCE_METRIC:Cosine}
  replication-factor: ${QDRANT_REPLICATION_FACTOR:1}
  write-consistency-factor: ${QDRANT_WRITE_CONSISTENCY_FACTOR:1}
  
  # Performance Configuration
  max-connections: ${QDRANT_MAX_CONNECTIONS:10}
  max-idle-connections: ${QDRANT_MAX_IDLE_CONNECTIONS:5}
  connection-max-idle-time-ms: ${QDRANT_CONNECTION_MAX_IDLE_TIME_MS:300000}
  enable-connection-pooling: ${QDRANT_ENABLE_CONNECTION_POOLING:true}
  
  # Indexing Configuration
  enable-hnsw-index: ${QDRANT_ENABLE_HNSW_INDEX:true}
  hnsw-m: ${QDRANT_HNSW_M:16}
  hnsw-ef-construct: ${QDRANT_HNSW_EF_CONSTRUCT:100}
  hnsw-ef-search: ${QDRANT_HNSW_EF_SEARCH:50}
  enable-payload-index: ${QDRANT_ENABLE_PAYLOAD_INDEX:true}
  
  # Search Configuration
  default-limit: ${QDRANT_DEFAULT_LIMIT:10}
  default-threshold: ${QDRANT_DEFAULT_THRESHOLD:0.7}
  enable-exact-search: ${QDRANT_ENABLE_EXACT_SEARCH:false}
  max-search-results: ${QDRANT_MAX_SEARCH_RESULTS:1000}
  
  # Backup and Recovery Configuration
  enable-auto-backup: ${QDRANT_ENABLE_AUTO_BACKUP:false}
  backup-schedule: ${QDRANT_BACKUP_SCHEDULE:0 2 * * *}
  backup-location: ${QDRANT_BACKUP_LOCATION:./backups/qdrant}
  backup-retention-days: ${QDRANT_BACKUP_RETENTION_DAYS:30}
  enable-compression: ${QDRANT_ENABLE_COMPRESSION:true}
  
  # Monitoring Configuration
  enable-metrics: ${QDRANT_ENABLE_METRICS:true}
  enable-health-checks: ${QDRANT_ENABLE_HEALTH_CHECKS:true}
  health-check-interval-ms: ${QDRANT_HEALTH_CHECK_INTERVAL_MS:30000}
  enable-slow-query-logging: ${QDRANT_ENABLE_SLOW_QUERY_LOGGING:true}
  slow-query-threshold-ms: ${QDRANT_SLOW_QUERY_THRESHOLD_MS:1000}
  
  # Security Configuration
  enable-tls: ${QDRANT_ENABLE_TLS:false}
  tls-cert-path: ${QDRANT_TLS_CERT_PATH:}
  tls-key-path: ${QDRANT_TLS_KEY_PATH:}
  tls-ca-path: ${QDRANT_TLS_CA_PATH:}
  verify-tls-cert: ${QDRANT_VERIFY_TLS_CERT:true}
  
  # Development Configuration
  enable-debug-logging: ${QDRANT_ENABLE_DEBUG_LOGGING:false}
  enable-query-logging: ${QDRANT_ENABLE_QUERY_LOGGING:false}
  enable-performance-logging: ${QDRANT_ENABLE_PERFORMANCE_LOGGING:false}
  
  # Collection-specific configurations
  collections:
    posts:
      name: posts
      vector-size: 384
      distance-metric: Cosine
      enable-payload-index: true
    comments:
      name: comments
      vector-size: 384
      distance-metric: Cosine
      enable-payload-index: true
    moderation:
      name: moderation
      vector-size: 384
      distance-metric: Cosine
      enable-payload-index: true
    embeddings:
      name: embeddings
      vector-size: 384
      distance-metric: Cosine
      enable-payload-index: true
  avatar:
    max-size: ${AVATAR_MAX_SIZE:2097152} # 2MB
    allowed-types: ${AVATAR_ALLOWED_TYPES:image/jpeg,image/png,image/gif,image/webp}
  # CORS Configuration
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:}
    allowed-methods: ${ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS,PATCH}
    allowed-headers: ${ALLOWED_HEADERS:*}
    exposed-headers: ${EXPOSED_HEADERS:Authorization,Content-Type,X-Total-Count}
    allow-credentials: ${ALLOW_CREDENTIALS:true}
    max-age: ${MAX_AGE:3600}

