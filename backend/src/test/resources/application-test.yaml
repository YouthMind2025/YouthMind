server:
  port: 0  # Random port for tests

spring:
  application:
    name: youthmind-backend-test
  
  # Database configuration will be provided by TestContainersConfig
  # No datasource configuration needed here
  
  jpa:
    hibernate:
      ddl-auto: validate  # Use validate since Flyway handles schema
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        globally_quoted_identifiers: true
        id:
          new_generator_mappings: true
        use_sql_comments: true
  
  flyway:
    enabled: true  # Enable Flyway migrations for PostgreSQL
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  
  # Redis configuration for tests - disabled for stability
  data:
    redis:
      enabled: false
      repositories:
        enabled: false

# Test CORS Configuration
app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:https://test.com,https://api.test.com}
    allowed-methods: ${ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS,PATCH}
    allowed-headers: ${ALLOWED_HEADERS:*}
    exposed-headers: ${EXPOSED_HEADERS:Authorization,Content-Type,X-Total-Count}
    allow-credentials: ${ALLOW_CREDENTIALS:true}
    max-age: ${MAX_AGE:3600}

# JWT Configuration for tests
jwt:
  secret: test-secret-key-for-testing-purposes-only
  expiration: 86400000
  refresh-expiration: 604800000

# Admin Configuration for tests
admin:
  secret-key: TEST_ADMIN_SECRET_KEY

# YouthMind Recommendation Engine Configuration for tests
youthmind:
  recommendation:
    enabled: false  # Disable recommendation engine for tests

# Logging for tests
logging:
  level:
    ai.youthmind: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web.cors: DEBUG
    org.hibernate.SQL: WARN