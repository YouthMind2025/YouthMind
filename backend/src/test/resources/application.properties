# Test database configuration - using Testcontainers PostgreSQL
# These properties will be overridden by TestContainersConfig dynamic properties
# but are kept here as fallback for non-Testcontainers tests

# PostgreSQL configuration (overridden by Testcontainers)
spring.datasource.url=jdbc:postgresql://localhost:5432/youthmind_test
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=test_user
spring.datasource.password=test_password

# JPA/Hibernate configuration for PostgreSQL tests
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Enable Flyway for tests to use production migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# Logging configuration for tests
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.flywaydb=DEBUG
logging.level.ai.youthmind=DEBUG

# Redis configuration for tests (disabled)
spring.data.redis.enabled=false
spring.data.redis.repositories.enabled=false

# Disable AI services for tests
ai.deepseek.enabled=false
youthmind.recommendation.enabled=false

# Test-specific configurations
spring.test.database.replace=none
spring.jpa.defer-datasource-initialization=false