# Performance optimization configuration
youthmind:
  performance:
    async-moderation-enabled: true
    batch-processing-enabled: true
    vector-search-enabled: true
    auto-scaling-enabled: true
    metrics-enabled: true
    max-concurrent-users: 10000
    vector-search-timeout-ms: 30
    batch-size: 100
    queue-capacity: 5000
    cpu-threshold-high: 80.0
    cpu-threshold-low: 20.0
    memory-threshold-high: 85.0
    memory-threshold-low: 30.0

# Micrometer metrics configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.75, 0.9, 0.95, 0.99
      slo:
        http.server.requests: 10ms, 50ms, 100ms, 200ms, 500ms, 1s, 2s, 5s

# Thread pool configuration
spring:
  task:
    execution:
      pool:
        core-size: 50
        max-size: 200
        queue-capacity: 2000
        keep-alive: 60s
    scheduling:
      pool:
        size: 10

# Database connection pool optimization
  datasource:
    hikari:
      maximum-pool-size: 100
      minimum-idle: 10
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
      leak-detection-threshold: 60000

# Redis optimization
  data:
    redis:
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 200
          max-idle: 50
          min-idle: 10
          max-wait: 2000ms

# JPA optimization
  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        generate_statistics: false
        cache:
          use_second_level_cache: true
          use_query_cache: true
          region:
            factory_class: org.hibernate.cache.jcache.JCacheRegionFactory
